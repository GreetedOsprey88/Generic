<!DOCTYPE html>
<html>
  <head>
    <title>Loading...</title>

    <style>
      .loading-page {
position: relative;
width: 100%;
height: 100vh;

background-image: url("/static/images/wallPaper.png");
background-size: cover;
background-position: center;
background-repeat: no-repeat;

display: flex;
justify-content: center;
align-items: center;

overflow: hidden;


}

.loading-page .overlay {
position: absolute;
inset: 0;
background: rgba(0,0,0,0.55);
}

.loading-container {
position: relative;
z-index: 2;


text-align: center;
color: white;


}

.loading-container h1 {
font-size: 3rem;
margin-bottom: 30px;
}

.loading-container p {
margin-top: 20px;
font-size: 1.1rem;
}

.spinner {
width: 80px;
height: 80px;


margin: 0 auto;

border: 8px solid rgba(255,255,255,0.15);
border-top: 8px solid #f97316;

border-radius: 50%;

animation: spin 1s linear infinite;


}

@keyframes spin {
from { transform: rotate(0deg); }
to   { transform: rotate(360deg); }
}

    </style>
  </head>

  <body class="loading-page">
    <div class="loading-container">
      <h1>Loading the World Cup...</h1>

      <div class="spinner"></div>

      <p>Please wait.</p>
    </div>

    <script>
      window.onload = function () {
        setTimeout(function () {
          window.location.href = "/wc_predictor";
        }, 500);
      };
    </script>
  </body>
</html>
